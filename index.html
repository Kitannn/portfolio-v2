<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Henry Tan — Portfolio</title>
  <meta name="description" content="Henry Tan (kitannn) — game designer and photographer based in Vancouver.">
  <meta name="theme-color" content="#0e0d12">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=32">
</head>
<body>
  <!-- Loading screen: console boot text over CRT noise with a centre bar; at 100% the bar folds into an "H" and the view zooms through it into the intro. -->
  <div id="loader" aria-hidden="true">
    <canvas class="ld-noise"></canvas>
    <div class="ld-crt"></div>
    <div class="ld-console"><div class="ld-left"></div><div class="ld-right"></div></div>
    <div class="ld-center">
      <div class="ld-bar"><i class="ld-fill"></i><b class="seg seg-l"></b><b class="seg seg-m"></b><b class="seg seg-r"></b></div>
      <div class="ld-cap"><span>LOADING...</span><span class="ld-pct">000%</span></div>
    </div>
    <div class="ld-foot"><span>LOADING...</span><div class="ld-track"><i></i></div><span class="ld-pct">000%</span></div>
  </div>
  <!-- Page chrome: frame, status bar, header -->
  <div class="frame" aria-hidden="true"></div>
  <div class="status">
    <button class="crt-toggle" type="button" aria-pressed="true" title="Toggle CRT effect">CRT</button>
    <button class="theme-dots" type="button" aria-label="Toggle light / dark theme"><i></i><i></i></button>
    <span class="clock" title="Vancouver time">--:--</span>
  </div>
  <header class="top">
    <a class="mark" href="#/" aria-label="Home"><img src="images/birbkit-256.jpg" alt=""><span id="mark-text">Henry Tan</span></a>
    <nav class="pill-nav">
      <a href="#/" data-page="home">Home</a>
      <a href="#/works" data-page="works">Work</a>
      <a href="#/profile" data-page="profile">Profile</a>
      <a href="#/contact" data-page="contact">Contact</a>
    </nav>
    <div class="socials" id="socials"></div>
  </header>

  <main id="app"></main>
  <!-- CRT overlay (every page): static grain, scanlines, vignette, rolling band. Toggle with the CRT button. -->
  <div id="crt" aria-hidden="true"><canvas></canvas><div class="crt-lines"></div></div>

  <!-- Project window (modal) -->
  <div class="modal" id="modal" hidden>
    <div class="modal-scrim" data-close></div>
    <section class="win modal-win" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
  </div>

  <noscript><p style="padding:120px 32px">Henry Tan — game designer in Vancouver. hkitannn[at]gmail.com</p></noscript>
  <!-- data.js, images/, assets/ and cv.html are synced from ../Portfolio by sync.ps1 — edit content there. -->
  <script src="data.js?v=2"></script>
  <script src="gl.js?v=8"></script>
  <script src="app.js?v=42"></script>
</body>
</html>
