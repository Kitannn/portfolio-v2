<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV — Henry Tan</title>
  <meta name="description" content="Curriculum vitae of Henry Tan, game designer.">
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--black:#080808;--white:#f0ede6;--line:rgba(240,237,230,.1);color-scheme:dark}
    body.light{--black:#f6f1e7;--white:#13120f;--line:rgba(19,18,15,.12);color-scheme:light}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--black);color:var(--white);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.65}
    a{color:inherit}
    header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 32px;background:color-mix(in srgb,var(--black) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
    header a,header button{text-decoration:none;opacity:.6;background:none;border:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
    header a:hover,header button:hover{opacity:1}
    header nav{display:flex;gap:20px}
    main{max-width:860px;margin:0 auto;padding:64px 32px 96px}
    h1{font-size:clamp(40px,7vw,72px);font-weight:800;line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
    .sub{margin-top:14px;opacity:.6;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .links{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px}
    .links a{text-decoration:none;border-bottom:1px solid var(--line)}
    .links a:hover{border-color:var(--white)}
    .summary{margin-top:32px;font-size:16px;font-weight:300;opacity:.85;max-width:68ch}
    h2{margin:56px 0 8px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;opacity:.5}
    .entry{padding:22px 0;border-bottom:1px solid var(--line)}
    .head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
    h3{font-size:16px;font-weight:700}
    h3 em{font-style:normal;font-weight:400;opacity:.7}
    .when{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;white-space:nowrap}
    .project{margin-top:2px;font-size:12px;opacity:.55}
    ul.b{margin:12px 0 0 18px}
    ul.b li{margin:5px 0;opacity:.8;padding-left:4px}
    ul.b li::marker{content:'— ';opacity:.4}
    .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .chips span{border:1px solid var(--line);padding:5px 11px;font-size:12px}
    .plain{list-style:none;margin-top:14px}
    .plain li{padding:4px 0;opacity:.85}
    @media (max-width:640px){header,main{padding-left:16px;padding-right:16px}.cols{grid-template-columns:1fr}header nav{gap:12px}}
    @media print{
      header{display:none}
      body{background:#fff;color:#000;font-size:11px}
      :root,body.light{--black:#fff;--white:#000;--line:#ddd}
      main{padding:0;max-width:none}
      .entry{break-inside:avoid}
      h2{margin-top:28px}
    }
  </style>
</head>
<body>
  <header>
    <a href="./" style="display:inline-flex;align-items:center;gap:8px"><img src="images/birbkit-256.jpg" alt="" width="22" height="22" style="width:22px;height:22px;border-radius:50%;object-fit:cover">← kitannn°</a>
    <nav><a href="./#/work">Work</a><a href="assets/resume/TAN_HENRY_RESUME.pdf" target="_blank" rel="noopener">PDF ↓</a><button type="button" onclick="print()">Print</button><button type="button" id="theme">Theme</button></nav>
  </header>
  <main id="cv"></main>
  <script src="data.js?v=10"></script>
  <script>
    (() => {
      const S = window.SITE, C = S.cv;
      const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const net = Object.fromEntries(S.networks);
      document.getElementById("cv").innerHTML = `
        <h1>${esc(S.name)}</h1>
        <div class="sub">${esc(S.role)}</div>
        <div class="links"><a href="${esc(net.LinkedIn)}" target="_blank" rel="noopener">LinkedIn ↗</a><a href="${esc(net.GitHub)}" target="_blank" rel="noopener">GitHub ↗</a><a href="./">Portfolio →</a></div>
        <p class="summary">${esc(C.summary)}</p>

        <h2>Experience</h2>
        ${C.experience.map((e) => `
          <div class="entry">
            <div class="head"><h3>${esc(e.org)} <em>— ${esc(e.role)}</em></h3><span class="when">${esc(e.when)}</span></div>
            ${e.project ? `<div class="project">${esc(e.project)}</div>` : ""}
            <ul class="b">${e.bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>
          </div>`).join("")}

        <div class="cols">
          <div><h2>Skills</h2><div class="chips">${C.skills.map((s) => `<span>${esc(s)}</span>`).join("")}</div></div>
          <div><h2>Proficiencies</h2><ul class="plain">${C.proficiencies.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>
          <div><h2>Education</h2><ul class="plain">${C.education.map((e) => `<li><b>${esc(e.school)}</b><br>${esc(e.credential)}<br><span style="opacity:.55">${esc(e.place)}</span></li>`).join("")}</ul></div>
          <div><h2>Languages</h2><ul class="plain">${C.languages.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>
        </div>`;

      try { if (localStorage.getItem("theme") === "light") document.body.classList.add("light"); } catch {}
      document.getElementById("theme").onclick = () => {
        const light = document.body.classList.toggle("light");
        try { localStorage.setItem("theme", light ? "light" : "dark"); } catch {}
      };
    })();
  </script>
</body>
</html>
